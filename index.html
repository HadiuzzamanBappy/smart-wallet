<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Smart Wallet</title>
    <meta name="description" content="Smart Wallet — manage your personal finances, track transactions and balances across accounts." />
    <link rel="canonical" href="https://wallet.picodevs.com/" />

    <!-- Progressive Web App / Mobile -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wallet" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png" />
    <link rel="icon" href="/favicon/favicon.ico" />
    <link rel="mask-icon" href="/favicon/favicon.svg" color="#5bbad5" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />

    <!-- Social / SEO -->
    <meta property="og:title" content="Smart Wallet" />
    <meta property="og:description" content="Manage your personal finances with Smart Wallet — transactions, budgets and insights." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wallet.picodevs.com/" />
    <meta property="og:image" content="https://wallet.picodevs.com/favicon/web-app-manifest-512x512.png" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smart Wallet" />
    <meta name="twitter:description" content="Manage your personal finances with Smart Wallet — transactions, budgets and insights." />
    <meta name="twitter:image" content="https://wallet.picodevs.com/favicon/web-app-manifest-512x512.png" />

    <meta name="robots" content="index, follow" />
    <meta name="keywords" content="smart wallet, personal finance, budget tracker, transaction manager, wallet app, finance tracker, expense manager" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Smart Wallet",
        "url": "https://wallet.picodevs.com/",
        "description": "Manage your personal finances, track transactions and balances across accounts with Smart Wallet.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "All",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Performance helpers (optional) -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
